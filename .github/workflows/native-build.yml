name: Native Nix builds

on:
  workflow_call:
    inputs:
      source-ref:
        description: Commit to build
        type: string
        required: true
      build-lab:
        description: Build and check the optional Cilium warning Agent
        type: boolean
        default: false
      save-records:
        description: Pass the build records to the release job
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-linux
            machine: aarch64
            runner: ${{ vars.ACTIONS_RUNNER_ARM64 || 'ubuntu-24.04-arm' }}
          - system: x86_64-linux
            machine: x86_64
            runner: ${{ vars.ACTIONS_RUNNER || 'ubuntu-24.04' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      NIX_SYSTEM: ${{ matrix.system }}
      RUNNER_MACHINE: ${{ matrix.machine }}
    steps:
      - name: Check runner architecture
        run: test "$(uname -m)" = "$RUNNER_MACHINE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: extra-sandbox-paths = /sys

      - name: Build and run focused Nix package tests
        run: |
          packages=".#packages.$NIX_SYSTEM"
          package="$packages.sysbox-compat"
          standard=$(nix eval --no-update-lock-file --raw "$package.drvPath")
          for alias in default sysbox-proc-transfer sysbox-cilium-lab; do
            test "$(nix eval --no-update-lock-file --raw "$packages.$alias.drvPath")" = "$standard"
          done
          nix build --no-update-lock-file --print-build-logs "$package"
          nix log "$package" > build.log
          nix log "$package.runtime" > runtime.log
          for test in \
            TestMissingAcquisition TestRootMountIDMismatch \
            TestProcPolicyBeforeNestedTransfer TestProcRequesterThreadPidfd \
            TestProcTransferInvalidNotificationDoesNotLaunch TestProcTransferRealNotification \
            TestRetryMountPropagationInKernel \
            TestFuseRequesterDescriptor TestFuseRequesterFilesystemIDs \
            TestFuseTargetKeepsSelectedDescriptor TestFuseOverlayMountAncestry \
            TestFuseBindAtimeOperation TestFuseWorkerReplyDeadline \
            TestFuseWorkerSlots TestFuseWorkerProcess TestFuseLegacyMountFlags \
            TestPerfOutputScope TestPerfOutputAttrs TestPerfOutputCgroupTarget \
            TestCiliumCompatABIFallsBack TestPerfOutputContinuesAfterRegistrationRemoval \
            TestCiliumJITProbeRequest TestCiliumJITProbeReply; do
            grep -F -- "--- PASS: $test (" build.log
          done
          grep -Fx -- 'PASS: fuse-mount-lookup C regression' build.log
          grep -F -- '--- PASS: TestCiliumNotificationsByDefault (' runtime.log
          for name in sysbox-fs sysbox-runc proc-mount-helper sysfs-mount-helper; do
            test -x "result/bin/$name"
          done

      - name: Record source revisions and checksums
        run: |
          package=".#packages.$NIX_SYSTEM.sysbox-compat"
          record="build-record-$NIX_SYSTEM.md"
          {
            printf '# Build record for %s\n\n' "$NIX_SYSTEM"
            printf 'Packaging revision `%s`\n\n' "$(git rev-parse HEAD)"
            printf '## Flake inputs\n\n```json\n'
            jq '[.nodes[].locked // empty]' flake.lock
            printf '```\n\n## Upstream source lock\n\n```json\n'
            cat result/share/sysbox-proc-transfer/sources.lock.json
            printf '```\n\n## Go module cache\n\n- sysbox-fs `'
            nix eval --no-update-lock-file --raw "$package.vendorHash"
            printf '`\n- sysbox-runc `'
            nix eval --no-update-lock-file --raw "$package.runtimeVendorHash"
            printf '`\n\n## Binary SHA-256\n\n```text\n'
            (cd result && sha256sum bin/{sysbox-fs,sysbox-runc,proc-mount-helper,sysfs-mount-helper})
            printf '```\n'
          } > "$record"
          cat "$record" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the optional Cilium warning Agent
        if: inputs.build-lab
        run: |
          agent=".#packages.$NIX_SYSTEM.cilium-warning-agent"
          nix build --no-update-lock-file --print-build-logs --out-link result-agent "$agent"
          cilium_rev=$(jq -er '.nodes.cilium.locked.rev' flake.lock)
          result-agent/bin/cilium-agent --version | grep -F -- "1.20.4 $cilium_rev 2026-10-23 go version"
          readelf --program-headers result-agent/bin/cilium-agent > agent-elf.log
          if grep -Eq '^[[:space:]]*(INTERP|DYNAMIC)[[:space:]]' agent-elf.log; then
            echo "The Cilium Agent requires a dynamic loader" >&2
            exit 1
          fi

          {
            printf '## Optional Cilium warning Agent (%s)\n\n' "$NIX_SYSTEM"
            printf '```text\n'
            nix eval --no-update-lock-file --raw "$agent.drvPath"
            printf '\n'
            sha256sum result-agent/bin/cilium-agent
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save release build record
        if: inputs.save-records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-record-${{ matrix.system }}
          path: build-record-${{ matrix.system }}.md
          if-no-files-found: error
